plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    exclusiveContent {
        forRepository {
            maven { url 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

legacyForge {
    version = project.forge_version
    runs {
        server {
            server()
            programArguments.add('--nogui')
        }
        client {
            client()
        }
    }
    mods {
        advbreeding {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, 'advbreeding.refmap.json'
    config 'advbreeding.mixins.json'
    config 'advbreeding.client.mixins.json'
    config 'advbreeding.compat.mixins.json'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    modCompileOnly "maven.modrinth:vanillabackport:${project.vb_version}"
    modCompileOnly "maven.modrinth:platform:${project.vb_platform_version}"
    if (project.hasProperty('withVb')) {
        modRuntimeOnly "maven.modrinth:vanillabackport:${project.vb_version}"
        modRuntimeOnly "maven.modrinth:platform:${project.vb_platform_version}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    manifest.attributes([
        "MixinConfigs": "advbreeding.mixins.json,advbreeding.client.mixins.json,advbreeding.compat.mixins.json"
    ])
}

processResources {
    inputs.property 'version', project.mod_version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.mod_version
    }
}
