plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    compileOnly "maven.modrinth:vanillabackport:${project.vb_version}"
    compileOnly "maven.modrinth:platform:${project.vb_platform_version}"
    if (project.hasProperty('withVb')) {
        runtimeOnly "maven.modrinth:vanillabackport:${project.vb_version}"
        runtimeOnly "maven.modrinth:platform:${project.vb_platform_version}"
    }
}

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArguments.add('--nogui')
        }
        client {
            client()
        }
    }
    mods {
        advbreeding {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": inputs.properties.version, "minecraft_version": project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
