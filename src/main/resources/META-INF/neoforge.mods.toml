modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0-only"

[[mods]]
modId = "advbreeding"
version = "${version}"
displayName = "Advanced Breeding"
authors = "iiAmPanda"
iconFile = "assets/advbreeding/icon.png"
description = '''Advanced animal genetics: every animal has a sex, a bloodline and seven genotype trait levels. Breed animals to pass on and improve traits. Shift + right-click an animal to inspect its genes.'''

[[mixins]]
config = "advbreeding.mixins.json"

[[mixins]]
config = "advbreeding.compat.mixins.json"

[[mixins]]
config = "advbreeding.client.mixins.json"

[[dependencies.advbreeding]]
modId = "vanillabackport"
type = "optional"
versionRange = "[1.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.advbreeding]]
modId = "neoforge"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.advbreeding]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"
